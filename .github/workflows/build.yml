name: Build

# Every change to main recreates the Windows installation file from scratch:
# configure, build everything (plugin, standalone, installer, licence helper),
# run the test suite against it, and publish the installer as a workflow
# artifact named for the version it carries — GoaSynth-Setup-<version>.exe,
# with its SHA-256 beside it. Releases still go through the Release workflow
# on v* tags; this is the standing "always a fresh installer" build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Restore the licence key header
        env:
          GOA_LICENSE_KEYS: ${{ secrets.LICENSE_KEYS_H }}
        run: |
          if [ -z "$GOA_LICENSE_KEYS" ]; then
            echo "::error::The repository secret LICENSE_KEYS_H is not set."
            echo "  Source/LicenseKeys.h is gitignored (generated by GoaSynthKeygen --init)"
            echo "  and Source/License.cpp refuses to compile without it."
            echo "  Add it once: repository Settings → Secrets and variables → Actions →"
            echo "  'New repository secret', name LICENSE_KEYS_H, value = the full contents"
            echo "  of your local Source/LicenseKeys.h. Then re-run this workflow."
            exit 1
          fi
          printf '%s\n' "$GOA_LICENSE_KEYS" > Source/LicenseKeys.h

      - name: Read the project version
        run: |
          VERSION=$(sed -n 's/^project(GoaSynth VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ -z "$VERSION" ]; then
            echo "::error::could not read the version from project() in CMakeLists.txt"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Configure and build everything
        run: |
          cmake -S . -B build
          cmake --build build --config Release --parallel

      - name: Run the test suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Name the installer for its version
        run: |
          cp "build/GoaSynthSetup_artefacts/Release/GoaSynth-Setup.exe" "GoaSynth-Setup-${version}.exe"
          sha256sum "GoaSynth-Setup-${version}.exe" > "GoaSynth-Setup-${version}.exe.sha256"
          echo '--- installer ---'
          ls -la GoaSynth-Setup-*

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: GoaSynth-Setup-${{ env.version }}
          path: |
            GoaSynth-Setup-*.exe
            GoaSynth-Setup-*.exe.sha256
          if-no-files-found: error

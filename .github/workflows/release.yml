name: Release

# A pushed vMAJOR.MINOR.PATCH tag becomes a GitHub Release whose body is the
# matching section of CHANGELOG.md and whose assets are the real Windows
# package, built on a windows runner from exactly that tag:
#
#   configure + build everything (plugin, standalone, installer, helper, tests)
#   → run the ctest suite (a red build never ships)
#   → package with tools/make-release.py (the same deterministic ZIP buyers
#     verify against the site's published checksums), plus the Setup installer
#     itself as a direct download named for its version —
#     GoaSynth-Setup-<version>.exe — with its own one-line .sha256
#   → generate the release notes from CHANGELOG.md
#   → create the Release with the ZIP, the versioned installer, and both
#     checksum files attached
#   → land the site update on main: the download row in the release notes is
#     regenerated with --download-row auto, which shows it only once the
#     assets it links actually exist (they do from the previous step), and
#     the site's verify block adopts this run's real hashes. That commit is
#     what deploys the site.
#
#     Ordering is the point: a local commit before the release exists would
#     either ship dead download links or need a network probe (which a
#     reproducible --check cannot rely on), so the row is gated on the
#     release being created and lands afterwards, from the tagged checkout.
#
# If the tag's version has no CHANGELOG.md section, the release is still
# published, but with a placeholder body and a warning annotation, so a tag
# never strands: add the section and edit the release on GitHub afterwards.
#
# One secret is required: LICENSE_KEYS_H — the contents of the gitignored
# Source/LicenseKeys.h (generated locally by `GoaSynthKeygen --init`; it holds
# the RSA public key and master-key digest, never the private key, which lives
# only in the seller's key store). Source/License.cpp refuses to compile
# without it, so the job fails fast with instructions when it is missing.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    shell: bash   # one shell for every step, on any runner OS

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Guard the tag shape
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not look like a release tag (expected vMAJOR.MINOR.PATCH, optionally with a -suffix)."
            exit 1
          fi

      - name: Read the project version
        run: |
          VERSION=$(sed -n 's/^project(GoaSynth VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ -z "$VERSION" ]; then
            echo "::error::could not read the version from project() in CMakeLists.txt"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Restore the licence key header
        env:
          GOA_LICENSE_KEYS: ${{ secrets.LICENSE_KEYS_H }}
        run: |
          if [ -z "$GOA_LICENSE_KEYS" ]; then
            echo "::error::The repository secret LICENSE_KEYS_H is not set."
            echo "  Source/LicenseKeys.h is gitignored (generated by GoaSynthKeygen --init)"
            echo "  and Source/License.cpp refuses to compile without it."
            echo "  Add it once: repository Settings → Secrets and variables → Actions →"
            echo "  'New repository secret', name LICENSE_KEYS_H, value = the full contents"
            echo "  of your local Source/LicenseKeys.h. Then delete and re-push the tag:"
            echo "      git push origin :refs/tags/<tag> && git push origin <tag>"
            exit 1
          fi
          printf '%s\n' "$GOA_LICENSE_KEYS" > Source/LicenseKeys.h

      - name: Configure and build everything
        run: |
          cmake -S . -B build
          cmake --build build --config Release --parallel

      - name: Run the test suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package the release ZIP and the installer
        run: |
          mkdir -p docs/downloads
          python tools/make-release.py
          # The Setup installer ships twice: inside the ZIP (the documented
          # buyer flow, verified against the site's checksums) and as a
          # direct release asset named for its version, for people who want
          # to skip the ZIP. Same bytes, so the hash SHA256SUMS.txt already
          # quotes covers both.
          cp "build/GoaSynthSetup_artefacts/Release/GoaSynth-Setup.exe" "dist/GoaSynth-Setup-${version}.exe"
          (cd dist && sha256sum "GoaSynth-Setup-${version}.exe" > "GoaSynth-Setup-${version}.exe.sha256")
          echo '--- dist/ ---'
          ls -la dist/

      - name: Generate release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if python tools/make-changelog.py --release-body "$VERSION" > release-body.md; then
            echo "Release notes for $VERSION taken from CHANGELOG.md."
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION — publishing a placeholder body. Add the section (python tools/make-changelog.py --check enforces it) and edit the release on GitHub, or delete and re-push the tag."
            {
              echo "## GoaSynth $VERSION"
              echo
              echo "Release notes for this version are not in [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) yet."
            } > release-body.md
          fi
          echo '--- release body ---'
          cat release-body.md

      - name: Create the GitHub Release with the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/GoaSynth-${version}-win64.zip" \
            "dist/GoaSynth-Setup-${version}.exe" \
            "dist/GoaSynth-Setup-${version}.exe.sha256" \
            "dist/SHA256SUMS.txt" \
            --verify-tag \
            --title "GoaSynth ${version}" \
            --notes-file release-body.md
          URL=$(gh release view "$GITHUB_REF_NAME" --json url -q .url)
          {
            echo "Published: $URL"
            echo
            echo "Assets: GoaSynth-${version}-win64.zip (installer + licence helper + EULA),"
            echo "GoaSynth-Setup-${version}.exe (direct download) + its .sha256, SHA256SUMS.txt (hashes for all of it)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Land the download row and the hashes on main
        run: |
          # The Release workflow just created the assets the site's download
          # row links, so only now may that row appear. Regenerate the notes
          # with --download-row auto (it sees a live ZIP and keeps the row) —
          # the local pre-release run used the default, which ships no row
          # for a version with no release yet. The verify block and the
          # published checksums adopt this run's real numbers, so the site
          # quotes exactly the bytes buyers download.
          cp dist/SHA256SUMS.txt docs/downloads/SHA256SUMS.txt
          python tools/make-changelog.py --download-row auto
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/version.json docs/downloads/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Site already current — nothing to commit."
          else
            git commit -m "Release ${version}: land the download row and the published hashes on the site"
            if git push origin HEAD:main; then
              echo "Site update pushed to main; Pages deploys it with the download row." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Could not push the site update to main (main moved past the tag?). The release itself is published; land the row by hand: run 'python tools/make-changelog.py --download-row auto' on main, commit, push."
              exit 1
            fi
          fi
